id: market_briefing_now
name: "장중 시장 관찰"

# 장중 시점 자동 + 봇/API 온디맨드 둘 다 지원.
# 자동: 평일 09:30 (시초가 정리) / 12:30 (점심) / 14:30 (마감 1시간 전).
# 온디맨드: 텔레그램 /briefing_now 또는 POST /api/briefings/market_briefing_now/run.
schedule:
  - trigger: cron
    expr: "30 9,12,14 * * 1-5"
    timezone: Asia/Seoul

knowledge:
  shared_canon: false
  rag_enabled: false

stages:
  - id: collect_kr_market
    module: stages.collect_kr_market
    type: collect
    timeout_sec: 60

  - id: persist
    module: stages.persist
    type: act
    depends_on: [collect_kr_market]
    timeout_sec: 15

  - id: notify
    module: stages.notify
    type: act
    depends_on: [persist]
    timeout_sec: 20

parts:
  - key: market_overview
    label: 시장개요
    order: 1
  - key: supply_sectors
    label: 수급+강세섹터
    order: 2
  - key: leading_stocks
    label: 주도주
    order: 3

contract_version: "1.0"
status: active
