id: morning_briefing
name: "아침 시황 브리핑"

schedule:
  - trigger: cron
    expr: "30 8 * * 1-5"
    timezone: Asia/Seoul

knowledge:
  shared_canon: true
  rag_enabled: true

stages:
  - id: collect_market
    module: stages.collect_market
    type: collect
    timeout_sec: 180

  - id: collect_news
    module: stages.collect_news
    type: collect
    timeout_sec: 30
    parallel_with: collect_market

  - id: check_principles
    module: stages.check_principles
    type: check
    depends_on: [collect_market]
    timeout_sec: 15

  - id: analyze
    module: stages.analyze
    type: analyze
    runtime: llm
    depends_on: [collect_market, collect_news, check_principles]
    timeout_sec: 120
    memory:
      context_id: morning_briefing
      budget_tokens: 4000

  - id: notify_data
    module: stages.notify_data
    type: act
    depends_on: [collect_market]
    timeout_sec: 15

  - id: notify_analysis
    module: stages.notify_analysis
    type: act
    depends_on: [analyze]
    timeout_sec: 15

contract_version: "1.0"
status: active
