# 자산전략가 (Wealth Strategist) 분석가 manifest
# Layer 2 — 학습부 wealth_compounding 1:1 매핑

id: wealth_strategist
display_name: 자산전략가
learning_dept: wealth_compounding

# 이 분석가가 RAG 회수에 사용할 학습부. compose.build_pipeline_prompt 의 rag_dept 인자로 자동 매핑.
reads:
  - wealth_compounding

# 이 분석가가 받을 카테고리 화이트리스트 (KNOWLEDGE-SYNC-001 Phase 2 M1).
# `<dept>/<category>` 형식. 비우면 reads dept 전체.
# 검증용 임시 지정: macro_roadmap 1 카테고리 (canon md 1 + RAG chunks 38).
# M3 분석가 분화 SPEC 에서 정식 정의 시 갱신 — 자산전략가는 보통 6 카테고리 전체로 복귀.
canon_categories:
  - wealth_compounding/macro_roadmap

# LLM 호출 설정. null 이면 config/defaults.yaml 의 llm.anthropic.* 사용.
llm:
  model: null            # 예: "claude-sonnet-4-5", "claude-opus-4-7"
  max_tokens: 4000
  temperature: 0.7

# 응답 규칙 — build_pipeline_prompt 의 response_rules 인자로 주입.
response_rules: |

  ## Response rules
  - 자유 자연어 본문으로 답한다 (JSON 강제 X).
  - 인용한 명제 ID 를 응답 끝에 다음 형식으로 한 줄 추가한다:
        ---
        cited: [M2, C3, I6]
    명제를 인용하지 않았다면 cited: [] 로 표기.
  - hedging 금지. 결론 먼저, 근거 뒤.
  - 명제 ID 인용은 필수 (cited 비우지 말 것). 단, 명제 문장 자체를 그대로 복붙하지 말고 사용자 질문 맥락에 맞게 설명·사례·적용을 재구성한다.
  - canon 에 직접 답이 없어도 인접 명제로 추론 가능하면 "직접 답은 아니나 인접 명제로 추론하면…" 으로 명시 후 제시. 인접 명제로도 안 되면 "framework 밖" 이라고 솔직히.

contract_version: "1.0"
