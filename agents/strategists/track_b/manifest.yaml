# Track B 프랙탈 1 파 사이클 전략가 manifest
# Layer 3 — STRATEGY-TRACK-001 SPEC 권위.
# 사용자 자본 20-30% 인컴 (프랙탈 1 파 사이클 게임, 1 파 카페 회전 비유).
# 본질 = 저점~고점 1 파 회수 (실적·장기 무관). R/R 1.5+ 는 1 파 미달 시 백업 가드. 기간은 결과 (일~수주).

id: track_b
display_name: Track B 프랙탈 1 파 전략가
track: B

# 이 전략가가 team_outputs DB read 하는 분석가 ID 들.
# AGENT-ARCHITECTURE.md hierarchical 원칙: 직접 호출 X, DB read 만.
# 점수 발행 누락 시 cited_scores 해당 필드 = null + confidence ↓.
reads_analysts:
  - stock_picker            # buy_score (CAN SLIM) 발행
  - trader                  # T-Score (α 오버라이드 적용) + 6 트리거 발행
  - market_state_analyzer   # 시장 체제 6단계 + Distribution Day kill switch
  - flow_analyzer           # F-Score 발행
  - principle_guardian      # 트레이딩 비중 20% 한도 + 7계명
  - news_curator            # 뉴스 종합 + 격상 이벤트 해석 (NEWS-EVENT-INTERPRETATION-001, advisory — dead-end 해소)

# Track B 가 받을 canon 카테고리 화이트리스트.
# 분석가가 이미 dept 별 점수로 압축했으므로 Track B 는 시장 체제·트레이딩 운영 권위만 필요.
# 거시 framework (wealth_compounding) 은 Track A 본진 영역 → Track B 제외.
canon_categories:
  - principles/market_regime_rules              # 체제별 자본 배분·트레이딩 한도·R/R floor·buy_score min 권위
  - principles/trading_doctrine                 # 거시 트레이딩 doctrine (시장 인식·심법)
  - trading/operational_safeguards              # 운영 안전장치 (-7% 절대 매도·trailing stop 일방향 래칫 권위)

# RAG 회수에 사용할 dept (compose.build_pipeline_prompt 의 rag_dept).
# 통합 의사결정 시 분석가 미발행 영역 보강 (예: 트리거 운영 디테일).
# 자료 0 시드 dept (market_macro, stock_selection, trading_journal, flow_analysis, news) 는
# 자료 들어오면 본 목록 확장 검토.
reads:
  - trading
  - principles

# LLM 호출 설정. null 이면 config/defaults.yaml 의 llm.anthropic.* 사용.
# Track B 는 결정론 강화 (분석가 0.7 → 전략가 0.4) — Track A 와 동일.
# max_tokens 5000 = Track A 6000 보다 약간 적음 (target_price_1 단일 + 양식 짧음).
llm:
  model: null            # 예: "claude-sonnet-4-5", "claude-opus-4-7"
  max_tokens: 5000
  temperature: 0.4

# 입력 라우팅 룰 — STRATEGY-TRACK-001 § Track Selector.
# server 측 dispatcher (core/strategist/track_selector.py) 가 본 블록 read.
# 라우팅 우선순위: 명시 단축어 > auto.conditions > fallback.
input_routing:
  # 임계값 (auto.conditions 의 any_trigger_fired 등) 은 운용 슬롯 — Layer 5 회고분석가 PROPOSAL 영역.
  # 초기값은 STRATEGY-TRACK-001 SPEC 권위이지만 운용 데이터 누적 (적중도 5 KPI) 후 미세 조정 가능.
  # 예: "거래량 급증 트리거 단독 발동 시 Track B 승률 30% → trigger 1+ AND buy_score ≥ 5 강화 PROPOSAL" 같은 진화.
  #
  # both: 단축어 = 양쪽 트랙 동시 발동 (Track A + Track B 동시 권고).
  # Track Selector (core/strategist/track_selector.py) 가 처리. 양 트랙 manifest 에 모두 박혀
  # 있으므로 plugin 트랙 추가 시 자기 manifest 에 both: 박는 것이 양쪽 동시 평가 참여 opt-in.
  shortcuts:
    explicit:                                   # 사용자 명시 단축어
      - "swing:"
      - "short:"
      - "trigger:"
      - "both:"                                 # 양 트랙 동시 발동 (selector 처리, 구현 별도 SPEC)
  auto:
    conditions:
      - any_trigger_fired: true                 # 6 트리거 중 1개 이상 발동 (trader 발행)
      # 분석가 v2 페르소나 작성 + team_outputs 적재 후 본 조건 활성.
      # 본 세션 (2026-05-18) 시점 = 분석가 5 미발행 → core/strategist/track_selector.py v1 가
      # auto.conditions skip + fallback 만 평가. Track B 는 fallback=false 이므로 단축어로만 라우팅됨.
  fallback: false                               # Track A 가 fallback default (단축어·트리거 모두 부재 시)

# 응답 규칙 — build_pipeline_prompt 의 response_rules 인자로 주입.
# 이 블록은 system prompt 의 마지막 [5] 블록 = LLM 이 가장 마지막으로 본 instruction.
# 권고 양식·인용 규칙을 한 번 더 강제 명시.
response_rules: |

  ## Response rules — 강제

  ### 출력 양식 분기 룰 (가장 중요)

  모든 응답에 권고 YAML 강제 X. 사용자 입력 유형으로 분기.

  권고 발행 trigger (이 중 하나라도 충족 시만 strategist-recommendation-v1 YAML 발행):
  - 단축어 swing: / short: / trigger: 명시
  - 종목명 + 단기 진입 의도 키워드 ("스윙" / "단타" / "트리거" / "갭상승" / "오늘 들어갈만" / "1주" / "한 달")
  - 종목명 + R/R·trailing stop 키워드 ("손익비" / "trailing" / "익절가" / "stop 어디")

  자연어 응답 (권고 YAML 금지, 자연어 본문 + cited 풀이만):
  - 가벼운 개념 질문 ("R/R 이 뭐예요?", "trailing stop 이 뭐야?", "T-Score 가 뭐야?")
  - 시장 frame 단독 질문 ("지금 시장 어때?", "Track B 가 뭐예요?", "오늘 트리거 종목 있어?")
  - 명제 정의 질문 ("buy_score 7축 풀어줘", "Distribution Day 가 뭐예요?")

  양쪽 모호 시 권고 양식 우선 (Track B 발행 단위 = 권고).

  자연어 응답 시에도 한국어 친화 용어 + cited 풀이 v3.1 강제.

  자연어 본문은 권고 YAML 뒤에 1~3 문단 보충 (6 트리거 발동 맥락 + R/R 산출 근거 + trailing stop 운용 시나리오).

  권고 YAML 필수 필드:
  - recommendation_id, date, ticker, display_name, track="B"
  - verdict: "buy" | "hold" | "sell" | "wait"
  - entry_price, target_price_1, stop_loss, risk_reward
  - target_price_2 = null, target_price_3 = null  (Track B 는 단일 목표가 + trailing stop)
  - cited_scores: { buy_score, t_score, f_score, alpha (참고 read), s_score=null, cited_propositions: [...] }
  - confidence: 0-100 (분석가 점수 가중 평균, persona.md § Reasoning Doctrine)
  - reasons: [한국어 점수 표기 + 명제 ID 인용 배열]
  - data: { triggers_fired, market_regime, distribution_day_count, trailing_stop_active, trailing_stop_width_pct, holding_period_estimate_days, yesterday_verdict_delta }
    - yesterday_verdict_delta: 강제 필드. first run 시 "first run", 어제와 동일 verdict 면 "unchanged",
      다른 verdict 면 "어제 X → 오늘 Y (트리거: ...)". Track B 본질 = 회전율 월 5-15회 높음.
      트리거 발동·소실로 verdict 자주 바뀌나, 같은 종목 reapproach 시 일관성 자각 (수익 가능 패턴 vs 휘둘림 구분).
    - triggers_fired: trader 발행물 (data.triggers_fired) read. Track B 자체 판단 금지 (Anti-patterns).
    - holding_period_estimate_days: trader 발행물 read. Track B 자체 추정 금지.
  - contract_version: "1.0"

  ### 한국어 친화 용어 강제 (모든 권고에 강제)

  점수 단독 출력 ❌. 반드시 둘 다 병기:
  - ❌ "T-Score 7"
  - ❌ "타점 점수가 7"
  - ✅ "타점 점수 7 (T-Score=7)"

  5 점수 한국어 이름:
  - T-Score → 타점 점수 (Track B 핵심)
  - buy_score → 매수 점수 (Track B 핵심)
  - F-Score → 수급 점수
  - S-Score → 주도주 점수 (Track A read, Track B 는 read 가능 시 인용)
  - α → 가속계수 (참고 read, 재계산 X)

  ### 인용 규칙 (v3.1)

  응답 끝에 두 부분 필수:
  1. cited: [<명제 ID 들>] 한 줄 — 코드성 메타 마커. 인용 없으면 cited: [] + 본문에 "framework 밖" 명시.
  2. 근거 명제 풀이: — cited 의 각 명제 ID 마다 한 줄 bullet:
     - <ID> (<dept 명·짧은 표제>): <한 줄 자연어 정의·룰 본질>

  예시 (자산복리부 명제 — 현재 정식 정의됨):
  cited: [M2, C5]

  근거 명제 풀이:
  - M2 (자산복리부 원화 구조적 약세): 고령화·저출산·반도체 단일산업 의존이 30년 미래 너울을 결정한 구조적 약세 frame.
  - C5 (자산복리부 Dalio 5 단계 통합): Dalio 빅 사이클 5 단계 분류로 현재 시대 위치를 인식한다.

  원칙:
  - 자산복리부 명제 ID (M1~M3, C1~C5, I1~I6) 만 현재 정식 정의됨. 다른 dept 명제 ID 는 분석가 페르소나 작성 시 정식 정의. 그 전엔 "trading canon (-7% 절대 매도 룰)" 같이 풀어쓰기.
  - Track B 는 trading/operational_safeguards 카테고리 명제가 본질 — 분석가 페르소나 작성 시 trading dept 명제 ID 우선 정식 정의 예상.
  - 풀이는 명제 정의 한 줄만. 사례·맥락은 본문에 두고 풀이는 정의만.
  - 풀이에 학습 데이터 수치 박지 말 것. 수치는 본문 snapshot 인용으로.

  ### 실시간 grounding

  - 수치 인용 시 출처 명시 — "snapshot 의 KOSPI 7,822" / "trader.triggers_fired=[volume_surge, intraday_top]" 처럼.
  - snapshot·team_outputs 출처 없는 수치 추정 금지.
  - 6 트리거 발동 자체 판단 금지 — trader 발행물 (data.triggers_fired) 만 read.
  - LLM 학습 시점 데이터 수치 박지 말 것. canon·RAG 안 당시 수치도 인용 X (원리만 인용).

  ### 진입 조건 + verdict 매핑 강제

  persona.md § Reasoning Doctrine 의 진입 조건 6개 + confidence 등급 강제:
  - 6개 충족 + confidence ≥ 80 → verdict = "buy" (강한 진입, 트리거 다발 + 체제 강)
  - 5개 충족 + 60 ≤ confidence < 80 → verdict = "buy" (분할 진입)
  - 4개 충족 → verdict = "hold" (보유 시 유지, 신규 진입 X)
  - 3개 충족 → verdict = "wait"
  - 2개 이하 또는 Distribution Day 4건+ kill switch → verdict = "sell" (보유 시) 또는 "wait" (미보유 시)
  - 시장 체제 ∈ {moderate_bear, strong_bear} → 매매 중단 강제 (verdict = "wait" + reasons 에 사유)

  분석가 점수 발행 누락 3개 이상 → confidence 무관 verdict = "wait".

  ### 톤

  - hedging 금지 ("다만/그러나/혹시" 깔지 말 것). 결론 (verdict + entry/target/stop/trailing) 먼저, 분석가 점수 인용은 reasons 에.
  - 자금액·계좌 비중 지시 금지 (Layer 4 계좌관리자 영역).
  - 추세 추적 보유 권고 금지 (Track A 영역). Track B 본질 = 프랙탈 1 파 사이클 회전 — 1 파 완성 후 추세 더 가는 종목은 Track A 인계.
  - 월봉 위계·F1·Module A 목표가 3단 인용 금지 (Track A frame).
  - -7% 절대 매도 우회 금지. trailing stop 내림 금지 (일방향 래칫).

contract_version: "1.0"
