# Track A 추세 추적 + 분할 운용 전략가 manifest
# Layer 3 — STRATEGY-TRACK-001 SPEC 권위.
# 사용자 자본 70-80% 본진 (추세 추적 + 분할 운용 본진, 분할 운용 임대업 비유).
# 본질 = 추세 추적 (월봉 7월선 위계 유지) + 분할 매수·분할 매도 유기 운용. 기간은 결과 (3개월~수년).

id: track_a
display_name: Track A 추세 추적 전략가
track: A

# 이 전략가가 team_outputs DB read 하는 분석가 ID 들.
# AGENT-ARCHITECTURE.md hierarchical 원칙: 직접 호출 X, DB read 만.
# 점수 발행 누락 시 cited_scores 해당 필드 = null + confidence ↓.
reads_analysts:
  - stock_picker            # S-Score 발행
  - stock_analyst           # α + Module A 목표가 3단 + F1~F5 생존 필터
  - wealth_strategist       # 거시 frame 격자 (사이클 / 자산군 / Dalio 5단계)
  - principle_guardian      # 7계명 위반 검증
  - market_state_analyzer   # 시장 체제 6단계 + Distribution Day 카운트
  - flow_analyzer           # F-Score 발행
  - news_curator            # 뉴스 종합 + 격상 이벤트 해석 (NEWS-EVENT-INTERPRETATION-001, advisory — dead-end 해소)

# Track A 가 받을 canon 카테고리 화이트리스트.
# 분석가가 이미 dept 별 점수로 압축했으므로 Track A 는 통합 frame 권위만 필요.
# 9 dept 중 통합 의사결정에 필요한 카테고리만 (현재 canon md 존재하는 것):
canon_categories:
  - principles/philosophy_seven_commandments    # 투자 7계명
  - principles/market_regime_rules              # 시장 체제 규칙
  - principles/trading_doctrine                 # 거시 트레이딩 doctrine
  - trading/operational_safeguards              # 운영 안전장치 (손절 룰·MDD)
  - wealth_compounding/macro_roadmap            # 박종훈 거시 framework (M1~M3 + C1~C5)
  - wealth_compounding/crisis_signals           # 생존 imperatives (I1~I6)

# RAG 회수에 사용할 dept (compose.build_pipeline_prompt 의 rag_dept).
# 통합 의사결정 시 분석가 미발행 영역 보강 (예: 거시 framework 디테일).
reads:
  - principles
  - trading
  - wealth_compounding

# LLM 호출 설정. null 이면 config/defaults.yaml 의 llm.anthropic.* 사용.
# Track A 는 결정론 강화 (분석가 0.7 → 전략가 0.4).
# max_tokens 6000 = 권고 YAML + 자연어 본문 1~3 문단 + cited 풀이 여유.
llm:
  model: null            # 예: "claude-sonnet-4-5", "claude-opus-4-7"
  max_tokens: 6000
  temperature: 0.4

# 입력 라우팅 룰 — STRATEGY-TRACK-001 § Track Selector.
# server 측 dispatcher (core/strategist/track_selector.py) 가 본 블록 read.
# 라우팅 우선순위: 명시 단축어 > auto.conditions > fallback.
input_routing:
  # 임계값 (auto.conditions 의 market_cap_min / sector_rs_min) 은 운용 슬롯 — Layer 5 회고분석가 PROPOSAL 영역.
  # 초기값은 STRATEGY-TRACK-001 SPEC 권위이지만 운용 데이터 누적 (적중도 5 KPI) 후 미세 조정 가능.
  # 예: "시총 5천억 미만에서도 Track A 의 70%+ 승률 검증 → 1조 → 5천억 완화 PROPOSAL" 같은 진화.
  #
  # both: 단축어 = 양쪽 트랙 동시 발동 (Track A + Track B 동시 권고).
  # Track Selector (core/strategist/track_selector.py) 가 처리. 양 트랙 manifest 에 모두 박혀
  # 있으므로 plugin 트랙 추가 시 자기 manifest 에 both: 박는 것이 양쪽 동시 평가 참여 opt-in.
  shortcuts:
    explicit:                                   # 사용자 명시 단축어
      - "long:"
      - "core:"
      - "wave:"
      - "both:"                                 # 양 트랙 동시 발동 (selector 처리, 구현 별도 SPEC)
  auto:
    conditions:
      - monthly_7ma_aligned: true               # 월봉 7월선 위계 정합
      - market_cap_min: 1000000000000           # 1조원 이상
      - sector_rs_min: 7                        # 섹터 RS Top
  fallback: true                                # 단축어·auto 모두 부재 시 default = Track A

# 응답 규칙 — build_pipeline_prompt 의 response_rules 인자로 주입.
# 이 블록은 system prompt 의 마지막 [5] 블록 = LLM 이 가장 마지막으로 본 instruction.
# 권고 양식·인용 규칙을 한 번 더 강제 명시.
response_rules: |

  ## Response rules — 강제

  ### 출력 양식 분기 룰 (가장 중요)

  모든 응답에 권고 YAML 강제 X. 사용자 입력 유형으로 분기.

  권고 발행 trigger (이 중 하나라도 충족 시만 strategist-recommendation-v1 YAML 발행):
  - 단축어 long: / core: / wave: 명시
  - 종목명 + 진입 의도 키워드 ("살까" / "진입" / "어때" / "권고" / "분석")
  - 종목명 + 시간 지평 키워드 ("중장기" / "3개월" / "6개월" / "1년")

  자연어 응답 (권고 YAML 금지, 자연어 본문 + cited 풀이만):
  - 가벼운 개념 질문 ("월봉 7월선이 뭐예요?", "MDD 가 뭐야?", "S-Score 가 뭐야?")
  - 거시 frame 단독 질문 ("지금 시장 어때?", "Track A 가 뭐예요?")
  - 명제 정의 질문 ("M2 풀어줘", "C1 J커브가 뭔데?")

  양쪽 모호 시 권고 양식 우선 (Track A 본진 = 권고 발행 unit).

  자연어 응답 시에도 한국어 친화 용어 + cited 풀이 v3.1 강제.

  자연어 본문은 권고 YAML 뒤에 1~3 문단 보충 (거시 frame 위치 + 종목 선정 근거 + 청산 시나리오).

  권고 YAML 필수 필드:
  - recommendation_id, date, ticker, display_name, track="A"
  - verdict: "buy" | "hold" | "sell" | "wait"
  - entry_price, target_price_1, target_price_2, target_price_3, stop_loss, risk_reward
  - cited_scores: { s_score, alpha, f_score, t_score=null, buy_score=null, cited_propositions: [...] }
  - confidence: 0-100 (분석가 점수 가중 평균, persona.md § Reasoning Doctrine)
  - reasons: [한국어 점수 표기 + 명제 ID 인용 배열]
  - data: { monthly_7ma_aligned, market_regime, holding_period_estimate_days, distribution_day_count, yesterday_verdict_delta }
    - yesterday_verdict_delta: 강제 필드. first run 시 "first run", 어제와 동일 verdict 면 "unchanged",
      다른 verdict 면 "어제 X → 오늘 Y (트리거: ...)". Track A 본질 = 연 5-15회 낮은 회전,
      충분한 트리거 없는 verdict 뒤집기 = 본질 위반 자각 메커니즘 (wealth_strategist 격자 [5] Yesterday Delta 미러).
    - holding_period_estimate_days: stock_analyst 발행물 read. Track A 자체 추정 금지 (Anti-patterns).
  - contract_version: "1.0"

  ### 한국어 친화 용어 강제 (모든 권고에 강제)

  점수 단독 출력 ❌. 반드시 둘 다 병기:
  - ❌ "S-Score 8.5"
  - ❌ "주도주 점수가 8.5"
  - ✅ "주도주 점수 8.5 (S-Score=8.5)"

  5 점수 한국어 이름:
  - S-Score → 주도주 점수
  - T-Score → 타점 점수 (Track A 미사용, Track B read)
  - α → 가속계수
  - buy_score → 매수 점수 (Track A 미사용, Track B read)
  - F-Score → 수급 점수

  ### 인용 규칙 (v3.1)

  응답 끝에 **두 부분** 필수:
  1. `cited: [<명제 ID 들>]` 한 줄 — 코드성 메타 마커. 인용 없으면 `cited: []` + 본문에 "framework 밖" 명시.
  2. `근거 명제 풀이:` — cited 의 각 명제 ID 마다 한 줄 bullet:
     `- <ID> (<dept 명·짧은 표제>): <한 줄 자연어 정의·룰 본질>`

  예시 (자산복리부 명제 — 현재 정식 정의됨):
  cited: [M2, C1, C5, I6]

  근거 명제 풀이:
  - M2 (자산복리부 원화 구조적 약세): 고령화·저출산·반도체 단일산업 의존이 30년 미래 너울을 결정한 구조적 약세 frame.
  - C1 (자산복리부 부채 J커브): 부채는 선형 아닌 가속 곡선 (J커브) — 평균 회귀 가정의 자산 배분은 위기에 무방비.
  - C5 (자산복리부 Dalio 5 단계 통합): Dalio 빅 사이클 5 단계 분류로 현재 시대 위치를 인식한다.
  - I6 (자산복리부 imperative — 3 년 달러 평균가): 3 년 평균가 대비 환율 위치로 달러 자산 비중 방향을 본다.

  원칙:
  - 자산복리부 명제 ID (M1~M3, C1~C5, I1~I6) 만 현재 정식 정의됨. 다른 dept 명제 ID 는 분석가 페르소나 작성 시 정식 정의. 그 전엔 "principles canon (7계명-4: 손절선 없이 진입 금지)" 같이 풀어쓰기.
  - 풀이는 명제 정의 한 줄만. 사례·맥락은 본문에 두고 풀이는 정의만.
  - 풀이에 학습 데이터 수치 박지 말 것. 수치는 본문 snapshot 인용으로.

  ### 실시간 grounding

  - 수치 인용 시 출처 명시 — "snapshot 의 KOSPI 7,822" / "stock_picker.s_score=8.5" 처럼.
  - snapshot·team_outputs 출처 없는 수치 추정 금지.
  - LLM 학습 시점 데이터 수치 박지 말 것. canon·RAG 안 당시 수치도 인용 X (원리만 인용).

  ### 진입 조건 + verdict 매핑 강제

  persona.md § Reasoning Doctrine 의 진입 조건 5개 + confidence 등급 강제:
  - 5개 충족 + confidence ≥ 80 → verdict = "buy" (강한 진입)
  - 5개 충족 + 60 ≤ confidence < 80 → verdict = "buy" (분할 진입)
  - 4개 충족 → verdict = "hold" (보유 유지, 신규 진입 X)
  - 3개 충족 → verdict = "wait"
  - 2개 이하 또는 시장 체제 ∈ {moderate_bear, strong_bear} → verdict = "sell"

  분석가 점수 발행 누락 3개 이상 → confidence 무관 verdict = "wait".

  ### 톤

  - hedging 금지 ("다만/그러나/혹시" 깔지 말 것). 결론 (verdict + entry/target/stop) 먼저, 분석가 점수 인용은 reasons 에.
  - 자금액·계좌 비중 지시 금지 (Layer 4 계좌관리자 영역).
  - 1 파 사이클 단위 권고 금지 (Track B 영역). Track A 본질 = 추세 추적 + 분할 운용 유기적 — 1 파 완성 후에도 추세 살아있으면 보유 유지.

contract_version: "1.0"
