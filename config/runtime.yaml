# wevelStock — 동적 운영 설정
# 이 파일을 수정하면 서버가 자동 감지하여 다음 호출부터 반영합니다 (프로세스 재시작 없이).
# defaults.yaml 의 값을 덮어씁니다. 바꾸고 싶은 것만 작성하세요.

# 예시: Telegram 활성화 (bot token 은 .env 에서)
# telegram:
#   enabled: true
#   formats:
#     principles: "🚨 [원칙] {title}\n{body}"

# 예시: 팀 ON/OFF
# teams:
#   principles:
#     enabled: true
#     thresholds:
#       total_weight_pct: 75   # 기본 80 을 75로 조이기

# LLM 백엔드: gemini (Google AI Studio 무료 티어) 사용 중
# GOOGLE_AI_API_KEY .env에 설정됨. 무료 한도: 일 1,500회 Flash / 50회 Pro
llm:
  provider: gemini
  gemini:
    # 2026-05-06: lite 가 503 high demand 발생 → flash 로 승격
    model: gemini-2.5-flash
    max_tokens: 4096
    temperature: 0.3
  # PRODUCTION-UX-001 — LLM 3 계층 정책 (Gemini-Anthropic 1:1 mirror).
  # 영역별 tier 매핑 → call_llm 시 resolve_model_for_area 가 tier+provider → 모델 결정.
  # 변경 시 hot reload (watchdog) — 재시작 불필요.
  tiers:
    fast:
      gemini: gemini-2.5-flash-lite
      anthropic: claude-haiku-4-5
    balanced:
      gemini: gemini-2.5-flash
      anthropic: claude-sonnet-4-5
    deep:
      gemini: gemini-2.5-pro
      anthropic: claude-opus-4-6
  areas:
    intent_classifier: fast       # 본 SPEC 신규
    answer_formatter: fast        # PROD-UX-2 신규
    analyst: balanced             # 9 분석가, 기존 유지
    strategist: balanced          # Track A/B, 기존 유지
    anchors_stage2: balanced      # LLM-TIER-MIGRATION-001 후속에서 fast 로 변경 예정
    retrospect: deep              # M4 후속
    executive_synthesis: balanced # ARCHITECTURE-HYBRID-EXECUTIVE-001 — 기본 임원 종합 = Flash(무료 1,500/일). Pro(deep)는 주요 트리거/이벤트만 model override (라우팅 추후 확정)

# 예시: 모델 교체 / 크로스 검증 활성화
# llm:
#   primary: claude-haiku-4-5     # 비용 절감
#   crosscheck:
#     enabled: true
#     targets: [orchestrator]
