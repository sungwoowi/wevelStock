# INFRA-SCORE-INPUTS-001 — raw 지표 → 0~10 축 매핑 breakpoints
#
# 본질(메모리 feedback_score_collapse_advisory): collector 가 원시 지표를 결정론 계산해
# LLM 에 주입하고, LLM 이 고차원 종합(판단=권위). 여기 breakpoints 는 *advisory* collapse
# 점수(t_score/f_score 참고선)의 축 입력 용도일 뿐 — 게이트키핑 X, LLM override 가능.
#
# 각 축 breakpoints = (raw_x, score_y) 쌍, raw_x 오름차순. score_y 비단조 허용(V자).
# scoring.map_to_axis 가 구간 선형보간 + [0,10] clamp + 0.5 단위.
#
# ⚠️ SLOT S2: 아래 값은 placeholder. production 분포 + 백테스팅으로 정정 (watchdog 즉시 반영).

technicals:
  # 이격도 % = (close - ma20) / ma20 * 100.
  # 적정 이격(약한 눌림~소폭 위) = 좋은 타점, 과대 이격(±) = 과열/이탈 → 저점 (V자).
  divergence:
    breakpoints: [[-20.0, 2.0], [-8.0, 6.0], [-2.0, 9.0], [3.0, 8.0], [12.0, 4.0], [25.0, 1.0]]
  # MACD histogram 정규화 = histogram / close * 1000 (per-mille). 음→양 전환 가점.
  macd:
    breakpoints: [[-3.0, 2.0], [-0.5, 4.0], [0.0, 5.0], [0.5, 7.0], [3.0, 9.0]]
  # 거래량 배율 = today / ma20. 1배 보통, 1.5~3배 건강한 동반, 6배+ 과열.
  volume:
    breakpoints: [[0.5, 3.0], [1.0, 5.0], [1.8, 8.0], [3.0, 9.0], [6.0, 4.0]]
  # R/R 비율 = (목표 - 진입) / (진입 - 손절). 1.5+ 양호, 3+ 우수 (STRATEGY-TRACK-001 floor 1.5).
  rr:
    breakpoints: [[0.5, 1.0], [1.5, 6.0], [2.0, 7.5], [3.0, 9.0], [5.0, 10.0]]
  # R/R 산출 규칙 (SLOT S3 — 스윙+ATR 하이브리드, 사용자 결단 2026-05-30 / risk-cap 2026-05-30).
  #   진입=현재가, 손절=직전 스윙저점을 [atr_k_floor, atr_k_cap]×ATR risk 밴드로 clamp,
  #   목표=인근 스윙고점(없으면 52주 고가). 목표 부재(신고가)·risk≤0 → null(정직).
  #   floor=너무 타이트한 손절(잔파동 털림) 방지, cap=수직급등주 손절 폭발(risk -47%) 방지.
  #   advisory 참고선일 뿐 — trader/전략가 출력이 권위. ⚠️ production 분포로 floor/cap 튜닝.
  rr_rule:
    atr_period: 14          # ATR 평균 기간 (영업일)
    atr_k_floor: 1.5        # 최소 위험 = 진입 - 1.5×ATR (잔파동 털림 방지)
    atr_k_cap: 3.0          # 최대 위험 = 진입 - 3.0×ATR (수직급등주 손절 폭발 방지)
    swing_timeframe: daily  # 스윙 추출 timeframe (anchors.extract_swing_candidates)

flow:
  # 60일 수급 모멘텀 turnaround, collector 가 -1.0~+1.0 정규화 (직전 30일 대비 최근 30일 부호·가속).
  momentum:
    breakpoints: [[-1.0, 1.0], [-0.3, 4.0], [0.0, 5.0], [0.3, 7.0], [1.0, 9.0]]
  # 시총 정규화 자금 유입 속도 = 외인+기관 60일 순매수액 / 시총 * 10000 (bp).
  inflow_speed:
    breakpoints: [[-50.0, 1.0], [0.0, 5.0], [50.0, 8.0], [150.0, 10.0]]
  # theme_match (SLOT S1, 2-Stage) — 권위 주체 net / (5주체 abs 합 +1) = -1..+1 → 0~10.
  # ⚠️ placeholder (SLOT S2 production 분포 튜닝). momentum 곡선 재사용.
  theme_match:
    breakpoints: [[-1.0, 1.0], [-0.3, 4.0], [0.0, 5.0], [0.3, 7.0], [1.0, 9.0]]
  # 테마 → 권위 주체 매핑 (SLOT S1/S8 초안). 주체 짧은 이름 = foreign/institution/individual/
  # financial_inv/pension. ⚠️ 운용 데이터 누적 후 사용자·회고분석가 합의로 갱신 (watchdog 즉시 반영).
  theme_authority:
    AI_semiconductor: [foreign, institution]
    semiconductor: [foreign, institution]
    cosmetics: [foreign]
    defense_nuclear: [pension, institution]
    automotive: [foreign, institution]
    secondary_battery: [foreign, institution]
    bio: [institution, individual]
    shipbuilding: [foreign, institution]
    robotics: [institution]
    kosdaq_theme: [individual]
  # 테마 taxonomy — key + 한국어 라벨 (LLM Stage 2 분류 후보). theme_authority 와 key 정합 유지.
  theme_taxonomy:
    AI_semiconductor: "AI·반도체"
    semiconductor: "반도체"
    cosmetics: "화장품"
    defense_nuclear: "방산·원전"
    automotive: "자동차"
    secondary_battery: "2차전지"
    bio: "바이오"
    shipbuilding: "조선"
    robotics: "로봇"
    kosdaq_theme: "코스닥 테마주"
  # 수동 override (ticker → theme key). 빈 시드 — LLM 오분류 정정 시 사용자가 박음.
  manual_theme: {}

advisory:
  # theme_match 미해소(taxonomy 부재·LLM 실패·권위 미정의) 시 중립 fallback (SLOT S1).
  theme_match_neutral: 5.0
