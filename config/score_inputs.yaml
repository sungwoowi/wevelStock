# INFRA-SCORE-INPUTS-001 — raw 지표 → 0~10 축 매핑 breakpoints
#
# 본질(메모리 feedback_score_collapse_advisory): collector 가 원시 지표를 결정론 계산해
# LLM 에 주입하고, LLM 이 고차원 종합(판단=권위). 여기 breakpoints 는 *advisory* collapse
# 점수(t_score/f_score 참고선)의 축 입력 용도일 뿐 — 게이트키핑 X, LLM override 가능.
#
# 각 축 breakpoints = (raw_x, score_y) 쌍, raw_x 오름차순. score_y 비단조 허용(V자).
# scoring.map_to_axis 가 구간 선형보간 + [0,10] clamp + 0.5 단위.
#
# SLOT S2 (2026-05-31): flow 3축 breakpoints 를 13종 라이브 종목 수급 분포로 1차 정합 정정.
#   원칙 = 절대 앵커(raw 0 = 균형 = 5점) 보존 + 관측 폭에 맞춰 꼬리 재스케일. 단일일 median 으로
#   recenter 안 함(snapshot overfitting 회피, 메모리 feedback_backtest_essence). 운용 누적 후 재튜닝.
#   technicals 축은 아직 placeholder(별 SLOT). production 분포 + 백테스팅으로 정정 (watchdog 즉시 반영).

technicals:
  # 이격도 % = (close - ma20) / ma20 * 100.
  # 적정 이격(약한 눌림~소폭 위) = 좋은 타점, 과대 이격(±) = 과열/이탈 → 저점 (V자).
  divergence:
    breakpoints: [[-20.0, 2.0], [-8.0, 6.0], [-2.0, 9.0], [3.0, 8.0], [12.0, 4.0], [25.0, 1.0]]
  # MACD histogram 정규화 = histogram / close * 1000 (per-mille). 음→양 전환 가점.
  macd:
    breakpoints: [[-3.0, 2.0], [-0.5, 4.0], [0.0, 5.0], [0.5, 7.0], [3.0, 9.0]]
  # 거래량 배율 = today / ma20. 1배 보통, 1.5~3배 건강한 동반, 6배+ 과열.
  volume:
    breakpoints: [[0.5, 3.0], [1.0, 5.0], [1.8, 8.0], [3.0, 9.0], [6.0, 4.0]]
  # R/R 비율 = (목표 - 진입) / (진입 - 손절). 1.5+ 양호, 3+ 우수 (STRATEGY-TRACK-001 floor 1.5).
  rr:
    breakpoints: [[0.5, 1.0], [1.5, 6.0], [2.0, 7.5], [3.0, 9.0], [5.0, 10.0]]
  # R/R 산출 규칙 (SLOT S3 — 스윙+ATR 하이브리드, 사용자 결단 2026-05-30 / risk-cap 2026-05-30).
  #   진입=현재가, 손절=직전 스윙저점을 [atr_k_floor, atr_k_cap]×ATR risk 밴드로 clamp,
  #   목표=인근 스윙고점(없으면 52주 고가). 목표 부재(신고가)·risk≤0 → null(정직).
  #   floor=너무 타이트한 손절(잔파동 털림) 방지, cap=수직급등주 손절 폭발(risk -47%) 방지.
  #   advisory 참고선일 뿐 — trader/전략가 출력이 권위. ⚠️ production 분포로 floor/cap 튜닝.
  rr_rule:
    atr_period: 14          # ATR 평균 기간 (영업일)
    atr_k_floor: 1.5        # 최소 위험 = 진입 - 1.5×ATR (잔파동 털림 방지)
    atr_k_cap: 3.0          # 최대 위험 = 진입 - 3.0×ATR (수직급등주 손절 폭발 방지)
    swing_timeframe: daily  # 스윙 추출 timeframe (anchors.extract_swing_candidates)

buyscore:
  # buy_score CAN SLIM 원시 지표 → 0~10 축 매핑 (INFRA-SCORE-INPUTS-001 v3, advisory base).
  # C/N/I 만 breakpoint 매핑 (S=flow.inflow_speed 재사용 / A=데이터 공백 중립 / L=screening_score / M=regime).
  # SLOT — production 분포로 튜닝. 절대 앵커(EPS 0%=3점·신고가=10점·기관 균형=5점) 보존.
  # C: 분기 EPS YoY % (전년 동기 대비). persona = +25%→10 / +10%→6 / 0%→3 / 음→0.
  c_eps_yoy:
    breakpoints: [[-50.0, 0.0], [0.0, 3.0], [10.0, 6.0], [25.0, 10.0], [60.0, 10.0]]
  # A: 연간 EPS YoY % (최근 회계연도 vs 전년, ≥3년 시계열 필요). CAN SLIM A = 연 25%+ 성장.
  #   분기(C)보다 계절성 평탄화 → 같은 앵커(0%→3·+25%→10·음수→0). 가속/3년 일관성은 md 원시 시계열로 LLM 판단.
  a_annual_eps_yoy:
    breakpoints: [[-50.0, 0.0], [0.0, 3.0], [10.0, 6.0], [25.0, 10.0], [60.0, 10.0]]
  # N: 52주 고가 대비 이격 % (pct_from_high, 0=신고가·음수=미달). 신고가 근접일수록 강함.
  n_high_proximity:
    breakpoints: [[-30.0, 2.0], [-15.0, 4.0], [-5.0, 7.0], [0.0, 10.0]]
  # I: 기관 비중 = institution_net / (|foreign|+|institution|+1) = -1..+1. 기관 매수 우위일수록 강함.
  i_institution_ratio:
    breakpoints: [[-1.0, 1.0], [-0.3, 3.5], [0.0, 5.0], [0.3, 7.0], [0.6, 9.0], [1.0, 10.0]]
  # S(수급) = demand composite = 최근 수급 momentum + 누적 inflow + 거래량 동반 가중 블렌드.
  #   본질(2026-06-01 NAVER 젠슨황 이벤트 발견): 누적 level(inflow)만 보면 하루짜리 대량 수급 전환을
  #   놓침. 최근 turnaround(momentum)가 이벤트를 잡고, 거래량 동반(spike)이 수요 진위를 확증.
  #   CAN SLIM S = 거래량 동반 수요. 결측 컴포넌트는 평가 제외 후 재정규화(비례).
  s_weights:
    momentum: 0.45   # 최근 15일 vs 직전 15일 외인·기관 turnaround (이벤트 포착)
    inflow: 0.30     # 30일 누적 자금 유입 (지속 매집)
    volume: 0.25     # 거래량 동반 (오늘/20일평균 spike)
  # 거래량 spike = 오늘 거래량 / 20일 평균. 1배=중립 동반, 3배+=강한 동반. 단조 증가(수요 확증).
  s_volume_confirm:
    breakpoints: [[0.5, 3.0], [1.0, 5.0], [2.0, 7.5], [4.0, 9.0], [6.0, 10.0]]

flow:
  # 60일 수급 모멘텀 turnaround, collector 가 -1.0~+1.0 정규화 (직전 30일 대비 최근 30일 부호·가속).
  # [-1,1] 유계 + 부호 turnaround 라 양극단 집중(bimodal). 0=균형 5점, ±1 saturate 1/10.
  momentum:
    breakpoints: [[-1.0, 1.0], [-0.5, 2.5], [-0.2, 4.0], [0.0, 5.0], [0.2, 6.0], [0.5, 7.5], [1.0, 10.0]]
  # 시총 정규화 자금 유입 속도 = 외인+기관 60일 순매수액 / 시총 * 10000 (bp).
  # 라이브 관측 -265~+170bp (p10 -107 / median -27 / p90 +80). 구 floor -50 은 너무 얕아
  # 6/13 종목이 1.0 에 깔려 저구간 변별 0 이던 것을 -150 floor + 중간점으로 해소. 0=균형 5점.
  inflow_speed:
    breakpoints: [[-150.0, 1.0], [-80.0, 2.5], [-30.0, 4.0], [0.0, 5.0], [40.0, 7.0], [90.0, 9.0], [170.0, 10.0]]
  # theme_match (SLOT S1, 2-Stage) — 권위 주체 net / (5주체 abs 합 +1) = -1..+1 → 0~10.
  # 라이브 관측 -0.52~+0.95 (median -0.24, 이 시점 외인 전종목 순매도 skew — 절대 앵커 0→5 보존,
  # recenter 안 함). 관측 폭에 맞춰 꼬리 재스케일 → 강분배 -0.5 saturate 2.5, 강매집 +1 → 10.
  theme_match:
    breakpoints: [[-1.0, 1.0], [-0.5, 2.5], [-0.2, 4.0], [0.0, 5.0], [0.2, 6.0], [0.5, 8.0], [1.0, 10.0]]
  # 테마 → 권위 주체 매핑 (SLOT S1/S8 초안). 주체 짧은 이름 = foreign/institution/individual/
  # financial_inv/pension. ⚠️ 운용 데이터 누적 후 사용자·회고분석가 합의로 갱신 (watchdog 즉시 반영).
  # 주의: 종목 레벨 수급은 KIS 3주체(외인·기관·개인)만 → pension/financial_inv 는 항상 0(死문자).
  #   연기금 주도 테마라도 종목 레벨에선 institution 으로 잡아야 점수 반영됨.
  theme_authority:
    AI_semiconductor: [foreign, institution]
    semiconductor: [foreign, institution]
    cosmetics: [foreign]
    defense_nuclear: [institution]  # 구 [pension, institution] — 종목 레벨 pension=0 死문자 제거
    automotive: [foreign, institution]
    secondary_battery: [foreign, institution]
    bio: [institution, individual]
    shipbuilding: [foreign, institution]
    robotics: [institution]
    kosdaq_theme: [individual]
  # 테마 taxonomy — key + 한국어 라벨 (LLM Stage 2 분류 후보). theme_authority 와 key 정합 유지.
  theme_taxonomy:
    AI_semiconductor: "AI·반도체"
    semiconductor: "반도체"
    cosmetics: "화장품"
    defense_nuclear: "방산·원전"
    automotive: "자동차"
    secondary_battery: "2차전지"
    bio: "바이오"
    shipbuilding: "조선"
    robotics: "로봇"
    kosdaq_theme: "코스닥 테마주"
  # 수동 override (ticker → theme key). LLM Stage 2 오분류/누락 정정.
  # 2026-05-31 SLOT S2 라이브 검증: 아모레·두산로보틱스가 None(중립 5.0)으로 빠져 변별 손실 → 대표주 박음.
  manual_theme:
    "090430": cosmetics    # 아모레퍼시픽 (화장품 대표주, LLM neutral_fallback 정정)
    "454910": robotics     # 두산로보틱스 (로봇 대표주, LLM neutral_fallback 정정)

  # 테마 key → 섹터 ETF 이름 매핑 (S-Score supply_chain 실측, SCREEN-RS/INFRA-SCORE-INPUTS-001 v2).
  # 종목 theme(classify_theme) → 매핑 섹터의 현재 RS 강도(snapshot.sector_rs, sector_rs.py)를
  # supply_chain 점수로 사용 = "이 종목이 강세 산업 공급망 중심에 있는가". 섹터명 = kr_sectors.DEFAULT_TRACKED_ETFS 기준.
  # 여러 섹터 매핑 시 최강 RS 채택(가장 강한 공급망). 매핑 없는 테마(kosdaq_theme)는 빈 리스트 → 중립.
  theme_sector_mapping:
    AI_semiconductor: ["KODEX AI반도체", "KODEX AI반도체핵심장비", "KODEX AI전력핵심"]
    semiconductor: ["KODEX 반도체"]
    cosmetics: ["TIGER 화장품"]
    defense_nuclear: ["KODEX 방산TOP10", "TIGER K방산&우주", "ACE 원자력TOP10"]
    automotive: ["KODEX 자동차"]
    secondary_battery: ["KODEX 2차전지산업"]
    bio: ["KODEX 바이오"]
    shipbuilding: ["TIGER 조선TOP10"]
    robotics: ["KODEX 로봇액티브"]
    kosdaq_theme: []   # 개별 테마주 — 대표 섹터 ETF 없음 → 중립

advisory:
  # theme_match 미해소(taxonomy 부재·LLM 실패·권위 미정의) 시 중립 fallback (SLOT S1).
  theme_match_neutral: 5.0
