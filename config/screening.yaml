# SCREEN-RS-EXTENSION-001 — 종목 스크리닝 RS + 과열도 파라미터 (오닐식, prism v2.13.0 #289 차용)
#
# 본질: 후보 선정을 "당일 급등률" 단일 기준에서 "상대강도(RS) + 과열도(extension)" 합성으로 전환.
#   꾸준히 강한 진짜 주도주 ↑, 이미 고점까지 치솟은 과열(막판 불꽃) 종목 ↓.
#
# 하드코딩 금지(CLAUDE.md #8·#9) — 모든 임계·가중치는 여기 외부화, watchdog hot reload 반영.
# 아래 값은 SLOT(production 분포 + 백테스팅 후 확정). 현재 = prism 차용 초기값.
#   SLOT R1 — rs 정규화 방식: percentile_rank(오닐 truest) 채택 (코드 고정, 추후 PROPOSAL).
#   SLOT R2 — extension 스케일 계수 k + ADR 윈도우 N: 아래 k / adr_window placeholder.
#   SLOT R3 — regime 가중치: 아래 regime_weights placeholder.

# RS 윈도우 (거래일). 종목 60일 수익률 산출 + MA20·ADR 입력 봉 수 기준.
rs_window: 60

# 과열도(ma20 위) 스케일 계수 k (extension_score = clamp(10 - k × normalized)). 클수록 과열 페널티 강함.
k: 1.0

# 이탈(ma20 아래) 스케일 계수 + 완충대 (SCREEN-RS C 결정 2026-06-02 — 양방향 건강도 축).
#   ma20 아래로 below_deadband_adr(ADR 단위) 넘게 빠지면 거리 비례 감점: 10 - k_below × (|normalized| - deadband).
#   이전엔 ma20 아래가 무조건 10 clamp 라 broken 종목이 Leader 축 만점 → 포화. C = 거리 비례 감점으로 변별.
#   deadband = ma20 살짝 밑(지지선 눌림)은 건강(10)으로 보는 완충 구간. SLOT — 다일 분포로 튜닝.
k_below: 1.0
below_deadband_adr: 1.0

# ADR(평균 일중 변동폭) 윈도우 N (거래일). mean((high-low)/close) 최근 N봉.
adr_window: 14

# 스크리닝 universe 백필 (universe-backfill 2026-06-02).
#   매일 refresh_all_tickers 가 거래대금 상위(leading) 종목을 chart_ohlcv 에 적재 → leading 일봉
#   상시 확보(캘리브레이션 다일 누적의 전제). 이전엔 시드가 지수+14섹터ETF만이라 leading 은
#   분석될 때만 적재돼 분포 진단 시 수동 백필 필요했음.
#   kospi_limit/kosdaq_limit = 매일 거래대금 상위 몇 종목을 universe 에 넣을지.
#   max_tickers = 일일 refresh 상한(KIS rate limit 보호). seed + 당일 leading 은 항상 포함,
#     남는 자리는 fetched_at 최신순으로 채우고 오래된 누적 종목은 daily refresh 에서 제외(데이터는 보존).
universe:
  kospi_limit: 30
  kosdaq_limit: 20
  max_tickers: 200

# chart_ohlcv 갱신 방식 (2026-08-15 증분화).
#   기존엔 매일 종목당 1,825봉을 통째로 다시 받았다 — KIS 가 1콜당 100봉이라 종목당
#   19 페이징 × 1.1초 ≈ 22초, 200종이면 **73분**. 새 봉 1~2개만 필요한데 7년치를 받은 것.
#   그 결과 18:00 갱신이 19:15에야 끝나 18:00 판세·18:05 권고가 갱신 중인 차트를 읽었다.
#
#   증분: 마지막 보유 봉 이후만 받는다 → 1콜(1.1초)/종목 ≈ 4분.
#   단 **수정주가 정합** 때문에 주 1회는 전체를 다시 받아야 한다. 액면분할·유상증자가
#   일어나면 과거 봉의 수정주가가 통째로 바뀌는데, 증분만 하면 옛 값이 그대로 남는다.
chart_refresh:
  full_period_days: 1825        # 전체 재적재 시 봉 수 (≈7.3년, 월봉 파동·백테스트가 소비)
  incremental_buffer_bars: 10   # 증분 시 여유분 — 정정·누락 봉 흡수
  min_incremental_bars: 12      # 최소 요청 봉 수 (연휴로 신규 봉이 적을 때 헛돌지 않게)
  max_incremental_gap_days: 200 # 이보다 오래 비었으면 증분보다 전체가 낫다
  full_refresh_weekday: 6       # 전체 재적재 요일 (월=0 … 일=6). 장이 없는 일요일.
  # 종목당 보관 봉 수 상한. 0 = 무제한(삭제 안 함).
  #   ⚠ 용량 때문이 아니다 — 실측 연 증가 ~14MB, 여유 43GB(2026-08-15). 무한 증가를
  #   막는 상한일 뿐이고, 낮추면 **백테스트와 월봉 파동이 직접 손상된다**(현재 보관
  #   2018-12~ 7.7년을 그 둘이 소비 중). 줄일 땐 그 영향을 먼저 확인할 것.
  retention_bars: 2600          # ≈10.4년 — 현재 보유(~1,880봉)보다 한참 위 = 당장은 no-op

# regime(시장 체제 6단계, market_state_analyzer 발행)별 RS vs 과열도 가중.
#   강세장 = RS(주도주) 강조·과열 허용 / 횡보·약세 = 과열 페널티 강조 (막판 불꽃 회피).
#   regime 미정의 시 scoring.screening_score 가 균등 가중(0.5/0.5) fallback.
regime_weights:
  parabolic:      { w_rs: 0.30, w_ext: 0.15 }   # 폭주 강세 — RS 강조, 과열 어느 정도 허용
  strong_bull:    { w_rs: 0.30, w_ext: 0.15 }   # 강한 강세
  moderate_bull:  { w_rs: 0.25, w_ext: 0.20 }   # 완만한 강세 — 균형
  sideways:       { w_rs: 0.15, w_ext: 0.30 }   # 횡보 — 과열 페널티 강조
  moderate_bear:  { w_rs: 0.15, w_ext: 0.30 }   # 완만한 약세 — 과열 페널티 강조
  strong_bear:    { w_rs: 0.15, w_ext: 0.30 }   # 강한 약세 — 과열 페널티 강조 (또는 매매 중단)

# 시장 체제 6단계 분류 임계 (market_macro.classify_market_regime, buy_score M축 + rank_candidates regime).
#   3 계층: 장기 골격(position) → 중기 방향(trend+ma20 기울기) → 강도·천장(breadth+분산일).
#   **narrow breadth(시총 상위 쏠림)는 breadth_weak 미만 → strong_bull 대신 moderate_bull 강등**:
#   결정론은 보수 라벨만, "구조적 성장 vs 천장 디버전스" 판단은 breadth·분산일 원시값 보고 LLM이 함.
#   하드코딩 금지(watchdog). SLOT — production 분포로 튜닝.
regime_thresholds:
  parabolic_slope_pct: 3.0     # ma20 5일 기울기 % 이 이상 = 폭주(parabolic) 후보
  breadth_strong: 0.55         # 상승종목 비율 이 이상 = 강한 폭 (parabolic 조건)
  breadth_weak: 0.40           # 이 미만 = 폭 좁은 상승 → moderate_bull 강등 (쏠림 경고)
  distribution_ceiling: 5      # 25일 분산일 이 이상 = 천장 경고 → parabolic 억제

# 자동 권고 생성 funnel Stage 0 결정론 컷 (AUTO-SIGNAL-GENERATION-001).
#   매일 watchlist(거래대금 상위 ∪ 보유 ∪ 관심) → rank_candidates(RS+과열도) → 이 컷 통과분만
#   Stage 1(전략가 직접 호출) 대상. LLM 비용·rate limit 보호. 하드코딩 금지(watchdog).
#   SLOT — 라이브 누적 후 분포로 튜닝(통과 종목 수가 너무 많/적으면 min_score·max_candidates 조정).
signal_gate:
  auto_run_enabled: true  # 자동 권고 cron 마스터 스위치 (false = 4 cadence 잡 전체 no-op)
  min_score: 5.0          # screening_score(0~10) 이 이상만 전략가 대상 (중앙값 = 위쪽 절반)
  max_candidates: 5       # Stage 1 상한 (cadence당). 0/음수 = 무제한. 2026-07-17 20→5 (LLM 콜·구독쿼터 절감)
  # 종목 병렬 처리 (asyncio 코루틴 — CPU·RAM 영향 거의 없음, I/O 대기 겹침). 제약=KIS rate-limit.
  #   8GB·서버 동시 가동 고려 보수 기본 3. 부하 시 1~2 로, 여유 시 ↑. 1 = 순차.
  concurrency: 3
  strategist_retries: 1   # 전략가 transient 실패(503·no_yaml) 재시도 횟수 (총 2회 시도)
  # 의사결정 밴드 게이트 — 장중 다중 cadence 비용 제어. 밴드 지문(regime·점수버킷·kill-switch)이
  #   직전 cadence 와 같으면 전략가 재호출 스킵(직전 verdict 유지). 비용 ∝ 밴드 넘은 종목 수.
  #   경계 = 전략가 의사결정 임계(새 magic number X). 경계 진동 hysteresis = SLOT.
  band_gate_enabled: true
  band_score_width: 2.0   # 점수 양자화 폭(정수 버킷). 클수록 둔감(비용↓). 2026-07-12 1.0→2.0 (호출 횟수↓)

# 결정론 차등 변조 (BRAIN-ALPHA-FLEXIBILITY-001 M1, core/signal/alpha_posture.py).
#   regime 을 blanket 게이트가 아니라 baseline 으로 — 섹터RS·주도주·파동·과열도가 종목별로
#   verdict 후보를 override. 약세장도 강세섹터+주도주+파동+눌림목 = 매수 후보(bear_override) /
#   강세장도 과열 추격은 회피(bull_chase_demote). kill-switch(분산일)는 보존.
#   하드코딩 금지(watchdog). 모든 임계 = SLOT (라이브 누적 후 BRAIN-QUALITY 회고 루프로 캘리브레이션).
alpha_posture:
  enabled: true
  # 매수 후보 최소 품질 (track별 1차 지표 + buy_score 둘 다 충족).
  min_s_score_a: 6.0      # Track A 1차 = S-Score(주도주)
  min_buy_score_a: 6.0
  min_t_score_b: 6.0      # Track B 1차 = T-Score(트리거)
  min_buy_score_b: 5.0
  # 차등 변조 임계.
  strong_sector_rs: 7.0   # 섹터 RS 이 이상 = 강세섹터
  leader_s_score: 7.0     # S-Score 이 이상 = 주도주
  leader_rs_score: 8.0    # RS 이 이상 = 주도주 (대체 경로)
  pullback_min_health: 6.0  # 과열도(건강도) 이 이상 = 눌림목 건강 (이탈/과열 아님)
  chase_min_health: 4.0     # 강세장에서 이 미만 = 과열 추격 → 매수 후보 강등
  require_wave_for_bear_override: true  # 약세장 override 에 파동 생존 필수
  # 복합 위험 게이트 (폭락 회피 — blanket 방어, 차등보다 우선. 2026-06-15 라이브 발견으로 신설).
  #   당일 급락 OR breadth 붕괴 OR VIX 패닉 OR 지속 분산 → 우량주여도 신규 진입 차단(반대매매·프로그램 매도 회피).
  #   dd 4→6 상향: 완만한 분산(4~5)은 차등 통과, 오닐 천장(6+)만 blanket. SLOT — 라이브 캘리브레이션.
  crash_change_pct: -2.5    # 당일 지수 등락률(%) 이 이하 = 폭락장
  breadth_collapse: 0.20    # 당일 상승종목 비율 이 이하 = 폭 붕괴
  # 분산일 2단 밴드 (2026-08-11 재보정). 실측: KOSPI 25일 분산일 60일 표본 분포 3~8·중앙값 6.
  #   구 dd_kill=6 은 임계가 기저율 한가운데라 55% 의 날에 blanket 발동(최근 40영업일은 100%)
  #   → track_b 560건 전부 wait(buy 역대 0건). 소프트 밴드로 이관해 차등 요구로 바꿨다.
  dd_soft: 6                # 이 이상 = 분산 고조. blanket 아님 — 주도주·강세섹터·눌림목·파동 요구
  dd_kill: 9                # 이 이상 = 표본 최대(8) 초과 = 진짜 이례적 → blanket 방어
  # 단계 라벨(TRADE-PLAN-LIFECYCLE-001 2단계) — wait 인데 1차 점수가 min − margin 이상 +
  #   conditional_entry 존재 → "매수대기" 단계 승격(관심 → 매수대기). SLOT.
  watching_score_margin: 1.0

# 결정론 가격대 메뉴 (TRADE-PLAN-LIFECYCLE-001 B-MS1, core/signal/trade_plan_menu.py).
#   결정론 = 객관 가격대 *계산기*(후보 메뉴), 결정자 아님. LLM 이 이 중에서 선택·조합(숫자 환각 차단).
#   소수의 절대 가드레일(오닐 −7%·종가기준)만 결정론 강제. 임계 = SLOT (라이브 캘리브레이션, watchdog).
trade_plan:
  enabled: true
  oneill_max_loss_pct: 0.07  # 오닐 −7% 절대 손실 한도 (손절 floor — 위반 시 clamp)
  atr_period: 14
  atr_k_floor: 1.5           # 손절 ATR 밴드 tight (compute_rr 정합 — 잔파동 털림 방지)
  atr_k_cap: 3.0             # 손절 ATR 밴드 wide (수직급등주 손절폭발 방지)
  n_buy_tranches: 3          # 분할매수 차수
  n_sell_tranches: 3         # 분할매도 차수
  ladder_fractions: [0.4, 0.7]  # 2·3차 entry→stop 보간 분율 (paper_trading 정합·물타기 차단)
  sell_ratios: [0.4, 0.3, 0.3]  # 분할매도 기본 비중 (앞단 많이)
  menu_bound_tol_pct: 0.03   # LLM 가격이 메뉴 후보와 이 % 이내면 menu-bound(환각 아님)
  max_levels: 4              # 다단 지지/저항/목표 최대 단수
  max_swing_stop_pct: 0.25   # 스윙저점이 진입 대비 이 % 초과로 멀면 stale 제외(수년전 저점 노이즈 차단)
  level_dedup_pct: 0.005     # 두 가격대가 이 % 이내면 동일 레벨로 dedup(스윙고점==52주고가 중복 제거)

# 관심종목 리스트 큐레이션 (TRADE-PLAN-LIFECYCLE 후속, collectors/universe_curation.py).
#   raw 거래대금/거래량 상위 → 잡주 제외(결정론 floor) + 정배열 위계("월/주봉 죽은 차트" proxy).
#   리스트별 차등(거래대금=대형 중장기 / 거래량양봉=중소형 모멘텀 허용). LLM 0. 임계 = SLOT(watchdog).
curation:
  enabled: true
  # max_change_pct 미설정 = 상한가 포함(사용자 결정 2026-06-16). 캡 원하면 숫자 지정(예: 20.0).
  require_ma_alignment: true # 정배열 위계(현재가>60·120일선, ma20≥ma60) — 죽은 차트 잡주 제외
  tv_min_trade_amount: 1.0e10  # 거래대금 상위: 일 거래대금 ≥ 100억
  tv_min_market_cap: 5.0e11    # 거래대금 상위: 시총 ≥ 5000억 (best-effort — 시총 확보 시)
  vb_min_trade_amount: 1.0e10  # 거래량 양봉: 일 거래대금 ≥ 100억
  vb_min_market_cap: 1.0e11    # 거래량 양봉: 시총 ≥ 1000억 (중소형 모멘텀 허용)
