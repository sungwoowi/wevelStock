# NEWS-SOURCE-001 — 뉴스부 자료층 설정 (하드코딩 0)
#
# MS-A (데이터 백본): 카테고리/시간축 라벨 정의 + 자료원 토글.
# MS-B (분류·digest): classify (LLM 라벨) + digest (tone tilt 임계 · top_themes).
# catalyst 블렌드 가중(buy_score N) 은 MS-C 에서 추가한다.
# watchdog hot reload 호환 (reload_news_source_config 로 캐시 클리어).

# 카테고리 6 (M3 — user_want_spec 5종 + 시장심리)
categories:
  - macro_policy        # 거시·통화·재정 (금리/유동성/환율)
  - industry_trend      # 산업 흐름 (반도체/2차전지/방산 등)
  - geopolitics         # 지정학 (전쟁/제재/공급망)
  - policy_political     # 정치·정책 (선거/규제/입법)
  - corporate_events    # 기업 이벤트 (실적/M&A/신제품)
  - market_sentiment    # 시장심리 (공포·탐욕·버블·조정 내러티브)

# 시간축 3단 (M6 — 단발→지속, 가변)
time_axes:
  - ephemeral_shock     # 단발 충격 (당일~수일)
  - short_theme         # 단기 테마 (~1~2주)
  - structural_trend    # 지속 흐름 (분기+)

# 방향/강도 (개별 뉴스 LLM 라벨 — MS-B)
directions: [up, neutral, down]
magnitudes: [1, 2, 3]

# 자료원 어댑터 토글 (M1 — RSS 1차 라이브, 수동 옵션, Perplexity drop-in)
sources:
  rss:
    enabled: true
    limit_per_source: 15
    # Google News 검색 쿼리 (None 이면 fetch_news 기본 큐레이션 사용)
    queries: null
  manual:
    enabled: true
  perplexity:
    enabled: false       # 이 환경 MCP 미연결 — drop-in SLOT (capability gap)

# 개별 뉴스 LLM 분류 (MS-B — classify_news_items)
# provider=gemini 명시(Anthropic 미결제 — claude-* default 금지). thinking_budget=0
# (Gemini-2.5 thinking 토큰 max_output 잠식 → JSON 잘림 방지). 라벨 불변 → 캐시 영속(긴 TTL).
classify:
  provider: gemini       # 실 호출 백엔드 (null 이면 call_llm 기본 provider)
  model: null            # null → call_llm 이 cfg.gemini.model (flash, BALANCED tier) 사용
  max_tokens: 512        # JSON 잘림 방지 하한
  cache_ttl_days: 365    # 뉴스 라벨은 불변 → 사실상 영속 캐시

# 미라벨링 재분류 백필 (AUTO-SIGNAL-INTEGRITY-001 T0-d) — classify 실패분(NULL 라벨) 재시도.
# 일일 news_ingest 4.5단계 수행. 멱등: 과거 성공 라벨은 캐시 히트(비용 0), 실패분만 실 LLM.
backfill:
  enabled: true
  lookback_days: 7       # 이 기간 내 수집분만 재시도 (오래된 뉴스는 시효 지남)
  limit: 120             # 1회 재시도 상한 (비용 유계)

# 거친 종합 (MS-B — build_news_digest). 정밀 점수 폐기(M4): tone 5단 tilt 만.
# tone = Σ(direction 부호 × magnitude × confidence/100) / Σweight → [-1,1] → 5단 매핑.
digest:
  # net tilt 임계 (정규화 [-1,1]). 경계 이하면 해당 밴드.
  tone_bands:
    bearish: -0.50       # net <= -0.50
    lean_bearish: -0.15  # net <= -0.15
    lean_bullish: 0.15   # net <  0.15  → neutral / 이상 lean_bullish
    bullish: 0.50        # net >= 0.50  → bullish
  # catalyst_tilt strength = |net tilt| → weak/mid/strong
  catalyst_strength:
    mid: 0.30            # |net| >= 0.30 → mid
    strong: 0.60         # |net| >= 0.60 → strong
  top_themes_n: 3        # top_themes 클러스터 상위 N
  trigger_titles_n: 3    # 테마당 대표 제목 수
  lookback_limit: 500    # 날짜 필터 전 조회 상한

  # 일일 cron 다중 scope 누적 (NEWS-SOURCE-001 후속 — 종목/섹터 scope 다일 윈도우).
  # market + universe 거래대금 상위 N + DEFAULT_TRACKED_ETFS 14섹터 를 매일 결정론 집계.
  scope_universe_limit: 50    # 종목 scope 상한 (거래대금 상위 N)
  persist_empty_scopes: true  # 빈 종목/섹터 scope 도 기록 ('미수집' vs 'neutral' 구분)

  # MS-C C3 — 종목 scope catalyst_tilt → buy_score N축 블렌드 (M7: 종목 뉴스→종목 점수).
  # 뉴스 없으면 52주 신고가만(현 동작 보존). 가중 합은 정규화(÷합).
  n_axis_blend:
    high_weight: 0.6     # 52주 신고가 가중
    news_weight: 0.4     # 뉴스 촉매 가중
    tilt_scores:         # catalyst_tilt {direction, strength} → 0~10
      up:   {weak: 6.0, mid: 7.5, strong: 9.5}
      neutral: 5.0
      down: {weak: 4.0, mid: 2.5, strong: 0.5}
