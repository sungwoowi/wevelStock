[project]
name = "wevelstock"
version = "0.1.0"
description = "AI 주식 분석 & 매매가이드 멀티 에이전트 시스템"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # === 런타임 서버 ===
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "watchdog>=4.0",
    # === 설정 & 환경 ===
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # === 로깅 ===
    "structlog>=24.1",
    # === LLM ===
    "anthropic>=0.34",
    "google-genai>=0.3",
    # === 지식 레이어 (RAG) ===
    "chromadb>=0.4",
    "pypdf>=4.0",
    "youtube-transcript-api>=0.6",
    # === 데이터 ===
    "pandas>=2.2",
    "numpy>=1.26",
    # === 시장 데이터 (market_briefing_pre 필수 — 미국지수/환율/금리/원자재/야간선물) ===
    "yfinance>=0.2",
    "fredapi>=0.5",
    # === 유틸 ===
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-frontmatter>=1.1",
    "rich>=13.7",
    "typer>=0.12",
    # === 텔레그램 봇 (BRIEFING-ON-DEMAND-001) ===
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
]
# 로컬 임베딩 (오프라인)
local-embed = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "server", "teams", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "teams"]
python_files = ["test_*.py"]
# Skip template directories and scaffolding-only trees
norecursedirs = ["_template", "*/_template", ".venv", "node_modules", "webapp", "data"]
addopts = "-v --tb=short --ignore-glob=**/_template/**"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG"]
ignore = ["E501"]  # line length (handled by formatter)

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
